name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-bookworm
        env:
          POSTGRES_DB: mathrag
          POSTGRES_USER: mathrag
          POSTGRES_PASSWORD: mathrag-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mathrag -d mathrag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://mathrag:mathrag-test-only@127.0.0.1:5432/mathrag
      TEST_DATABASE_URL: postgresql+asyncpg://mathrag:mathrag-test-only@127.0.0.1:5432/mathrag_test
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install --no-cache-dir -r requirements.lock.txt
      - name: Create isolated test database
        run: >-
          docker exec
          $(docker ps -q --filter ancestor=pgvector/pgvector:0.8.5-pg18-bookworm)
          createdb -U mathrag mathrag_test
      - run: alembic upgrade head
      - run: >-
          pytest -q
          --ignore=tests/evaluation
          --ignore=tests/test_retrieval_baseline.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
      - run: pip install pytest PyYAML
      - run: pytest -q tests/test_compose_contract.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mathrag:quality
